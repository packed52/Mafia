        winCondition: 'Остаться последним выжившим среди всех игроков за столом.' },
      cultist: { name: 'Сектант (Проповедник)', icon: '🕯️', factionLabel: 'Тайный Культ Секты', badgeClass: BADGE.CULT, targetMode: 'SINGLE_ALIVE',
        description: 'Каждую ночь вербует одного живого игрока в свой культ. Завербованные сохраняют свои роли. Если Сектанта убивают или казнят — культ распадается.',
        winCondition: 'Побеждает, когда все выжившие за столом состоят в секте.' },
      puppeteer: { name: 'Кукловод', icon: '🎭', factionLabel: 'Нейтрал / Манипулятор', badgeClass: BADGE.PUPPET, targetMode: 'DOUBLE_ALIVE',
        description: 'Ночью выбирает Марионетку (Цель 1) и Новую мишень (Цель 2). Если Марионетка использует активное действие, оно перенаправляется на новую мишень.',
        winCondition: 'Выжить и манипулировать столом.' },
      mirror: { name: 'Зеркало (Хамелеон)', icon: '🪞', factionLabel: 'Нейтрал-трансформер', badgeClass: BADGE.MIRROR, targetMode: 'FIRST_NIGHT_ONLY',
        description: 'В первую ночь выбирает игрока-донора. До его гибели считается мирным жителем. Как только донор погибает, Зеркало копирует его роль и фракцию.',
        winCondition: 'Побеждает с той фракцией, чью роль скопировало.' }
    };

    const PHASE_LABELS = {
      LOBBY: 'Лобби', ROLE_REVEAL: 'Раздача ролей', FIRST_NIGHT_INTRO: 'Знакомство мафии',
      NIGHT: 'Ночь', MORNING_LAST_WORDS: 'Утро', DAY: 'День', VOTING: 'Голосование', CONFIRM_VOTE: 'Вердикт',
      KAMIKAZE_REVENGE: 'Месть Камикадзе', GAME_OVER: 'Конец игры'
    };

    // ---------- Звуки ----------
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function tone(type, f0, f1, dur, vol) {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f0, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(f1, ctx.currentTime + dur);
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }
    const playCardFlipSound = () => tone('sine', 420, 90, 0.09, 0.25);
    const playPhaseChangeSound = () => tone('triangle', 140, 65, 0.55, 0.25);

    function playHorrorDeathSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        [0, 0.28, 0.85, 1.12].forEach((offset, idx) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(idx % 2 === 0 ? 65 : 50, now + offset);
          o.frequency.exponentialRampToValueAtTime(25, now + offset + 0.22);
          g.gain.setValueAtTime(0.6, now + offset);
          g.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.22);
          o.connect(g); g.connect(ctx.destination);
          o.start(now + offset); o.stop(now + offset + 0.23);
        });

        [580, 615, 890].forEach(freq => {
          const o = ctx.createOscillator();
          const f = ctx.createBiquadFilter();
          const g = ctx.createGain();
          o.type = 'sawtooth';
          o.frequency.setValueAtTime(freq, now + 0.45);
          o.frequency.exponentialRampToValueAtTime(freq * 1.45, now + 0.75);
          o.frequency.exponentialRampToValueAtTime(190, now + 2.3);
          f.type = 'bandpass';
          f.frequency.setValueAtTime(1100, now + 0.45);
          f.Q.setValueAtTime(4, now + 0.45);
          g.gain.setValueAtTime(0.001, now + 0.45);
          g.gain.linearRampToValueAtTime(0.22, now + 0.55);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 2.35);
          o.connect(f); f.connect(g); g.connect(ctx.destination);
          o.start(now + 0.45); o.stop(now + 2.4);
        });

        const size = Math.floor(ctx.sampleRate * 2.5);
        const buf = ctx.createBuffer(1, size, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;
        const noise = ctx.createBufferSource();
        noise.buffer = buf;
        const nf = ctx.createBiquadFilter();
        nf.type = 'bandpass';
        nf.frequency.setValueAtTime(900, now);
        nf.frequency.linearRampToValueAtTime(1800, now + 1.2);
        nf.frequency.linearRampToValueAtTime(600, now + 2.5);
        nf.Q.setValueAtTime(3.5, now);
        const ng = ctx.createGain();
        ng.gain.setValueAtTime(0.01, now);
        ng.gain.linearRampToValueAtTime(0.18, now + 0.5);
        ng.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
        noise.connect(nf); nf.connect(ng); ng.connect(ctx.destination);
        noise.start(now);

        const bell = ctx.createOscillator();
        const bg = ctx.createGain();
        bell.type = 'triangle';
        bell.frequency.setValueAtTime(110, now + 0.4);
        bg.gain.setValueAtTime(0.5, now + 0.4);
        bg.gain.exponentialRampToValueAtTime(0.001, now + 3.2);
        bell.connect(bg); bg.connect(ctx.destination);
        bell.start(now + 0.4); bell.stop(now + 3.2);
      } catch (e) {}
    }

    // ---------- Фоновая музыка (генеративная, Web Audio) ----------
    const music = {
      ctx: null, master: null, fxIn: null, bus: null, timer: null,
      nextTime: 0, bar: 0, playing: false,
      chords: [
        { bass: 110.00, notes: [220.00, 261.63, 329.63] }, // Am
        { bass: 87.31,  notes: [174.61, 220.00, 261.63] }, // F
        { bass: 130.81, notes: [261.63, 329.63, 392.00] }, // C
        { bass: 98.00,  notes: [196.00, 246.94, 293.66] }  // G
      ],
      scale: [440.00, 523.25, 587.33, 659.25, 783.99, 880.00],
      init() {
        if (this.master) return;
        const ctx = getAudioContext();
        this.ctx = ctx;
        this.master = ctx.createGain();
        this.master.gain.value = 0.3;
        this.master.connect(ctx.destination);
        this.fxIn = ctx.createGain();
        this.fxIn.connect(this.master);
        const conv = ctx.createConvolver();
        const len = Math.floor(ctx.sampleRate * 3);
        const ir = ctx.createBuffer(2, len, ctx.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const d = ir.getChannelData(ch);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
        }
        conv.buffer = ir;
        const wet = ctx.createGain();
        wet.gain.value = 0.45;
        this.fxIn.connect(conv); conv.connect(wet); wet.connect(this.master);
      },
      start() {
        if (this.playing) return;
        try { this.init(); } catch (e) { return; }
        const ctx = this.ctx;
        if (ctx.state === 'suspended') ctx.resume();
        this.playing = true;
        this.bus = ctx.createGain();
        this.bus.gain.value = 0.0001;
        this.bus.connect(this.fxIn);
        this.bus.gain.setTargetAtTime(1, ctx.currentTime, 1.0);
        this.nextTime = ctx.currentTime + 0.2;
        this.schedule();
        this.timer = setInterval(() => this.schedule(), 500);
      },
      stop() {
        if (!this.playing) return;
        this.playing = false;
        clearInterval(this.timer);
        const bus = this.bus;
        bus.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.2);
        setTimeout(() => { try { bus.disconnect(); } catch (e) {} }, 1500);
      },
      schedule() {
        if (!this.playing) return;
        const barLen = (60 / 66) * 4;
        if (this.nextTime < this.ctx.currentTime) this.nextTime = this.ctx.currentTime + 0.1;
        while (this.nextTime < this.ctx.currentTime + 3) {
          this.playBar(this.nextTime, barLen);
          this.nextTime += barLen;
          this.bar++;
        }
      },
      tone(type, freq, start, dur, vol, attack, release, lp) {
        const ctx = this.ctx;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = type;
        o.frequency.value = freq;
        let node = o;
        if (lp) {
          const f = ctx.createBiquadFilter();
          f.type = 'lowpass'; f.frequency.value = lp;
          o.connect(f); node = f;
        }
        node.connect(g); g.connect(this.bus);
        g.gain.setValueAtTime(0.0001, start);
        g.gain.linearRampToValueAtTime(vol, start + attack);
        g.gain.setValueAtTime(vol, start + Math.max(attack, dur));
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur + release);
        o.start(start);
        o.stop(start + dur + release + 0.1);
      },
      pluck(freq, start, vol) {
        const ctx = this.ctx;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'triangle';
        o.frequency.value = freq;
        o.connect(g); g.connect(this.bus);
        g.gain.setValueAtTime(0.0001, start);
        g.gain.linearRampToValueAtTime(vol, start + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, start + 1.6);
        o.start(start);
        o.stop(start + 1.7);
      },
      playBar(t, barLen) {
        const ch = this.chords[this.bar % 4];
        const beat = barLen / 4;
        // бас
        this.tone('sine', ch.bass, t, barLen, 0.22, 0.05, 0.9);
        // мягкий пэд
        ch.notes.forEach((f, i) => {
          this.tone('triangle', f * (i % 2 ? 1.002 : 0.998), t, barLen, 0.06, 1.2, 1.4, 900);
          this.tone('sine', f * 2, t, barLen, 0.02, 1.4, 1.4);
        });
        // арпеджио
        const pool = [ch.notes[0] * 2, ch.notes[1] * 2, ch.notes[2] * 2, ch.notes[0] * 4];
        [0, 1, 2, 3, 2, 1, 2, 1].forEach((p, i) => {
          if (Math.random() < 0.2) return;
          this.pluck(pool[p], t + (i * beat) / 2, 0.08);
        });
        // певучая мелодия
        if (Math.random() < 0.65) {
          const f = this.scale[Math.floor(Math.random() * this.scale.length)];
          const at = t + (Math.random() < 0.5 ? 0 : beat * 2);
          this.tone('sine', f, at, beat * 2, 0.06, 0.1, 1.6);
        }
      }
    };

                      </div>
                    )}
                  </div>

                  {/* Чат мафии */}
                  {isAlive && isBlackTeam && phaseInfo.status === 'NIGHT' && (
                    <div className="bg-slate-900 border border-red-900/60 rounded-2xl p-5 space-y-3">
                      <h3 className="text-sm font-bold uppercase tracking-wider text-red-400">🦹‍♂️ Закрытый ночной радиоканал Мафии</h3>
                      <div className="h-36 bg-slate-950 p-3.5 rounded-xl overflow-y-auto space-y-1.5 border border-red-950">
                        {mafiaMessages.map((m, idx) => (
                          <div key={idx} className="text-xs">
                            <span className="font-bold text-red-400">{m.senderName} ({ROLES_CATALOG[m.role]?.name || m.role}): </span>
                            <span className="text-slate-200">{m.message}</span>
                          </div>
                        ))}
                      </div>
                      <form onSubmit={sendMafiaChat} className="flex gap-2">
                        <input type="text" placeholder="Координация ночного выстрела..." value={mafiaInput}
                          onChange={e => setMafiaInput(e.target.value)}
                          className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-red-500" />
                        <button type="submit" className="bg-red-800 hover:bg-red-700 text-white font-bold px-5 py-2 rounded-xl text-sm transition">Шепнуть</button>
                      </form>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
