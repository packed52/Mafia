  <style>
    .perspective-1000 { perspective: 1000px; }
    .preserve-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotateY-180 { transform: rotateY(180deg); }

    /* Анимация стекающих капель крови и тряски экрана при смерти */
    @keyframes bloodDrip {
      0% { transform: translateY(-100%) scaleY(0.8); opacity: 0.9; }
      70% { opacity: 0.95; }
      100% { transform: translateY(105vh) scaleY(1.6); opacity: 0; }
    }
    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-8px, -6px) rotate(-1deg); }
      30% { transform: translate(8px, 4px) rotate(1deg); }
      45% { transform: translate(-6px, 6px) rotate(-0.5deg); }
      60% { transform: translate(6px, -4px) rotate(0.5deg); }
      75% { transform: translate(-4px, 2px) rotate(0deg); }
    }
    .animate-shake {
      animation: screenShake 0.65s cubic-bezier(.36,.07,.19,.97) both;
    }
    .blood-drop {
      position: fixed;
      top: 0;
      width: 6px;
      background: linear-gradient(180deg, #450a0a 0%, #991b1b 60%, #ef4444 100%);
      border-radius: 0 0 9999px 9999px;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.8);
      pointer-events: none;
      z-index: 60;
      animation: bloodDrip linear infinite;
    }
    .blood-vignette {
      background: radial-gradient(circle, rgba(0,0,0,0.4) 30%, rgba(127,29,29,0.85) 100%);
    }
  </style>

    // ==================== СИНТЕЗАТОР ЗВУКОВ WEB AUDIO API ====================
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playCardFlipSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(420, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(90, ctx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.09);
      } catch (e) {}
    }

    function playPhaseChangeSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(65, ctx.currentTime + 0.55);
        gain.gain.setValueAtTime(0.01, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.55);
      } catch (e) {}
    }

    // Многослойный пугающий аудиоэффект при смерти (Удары сердца + Крик ужаса + Шепот + Колокол)
    function playHorrorDeathSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        // 1. Тяжелые удары сердца (2 глухих толчка)
        [0, 0.28, 0.85, 1.12].forEach((offset, idx) => {
          const heartOsc = ctx.createOscillator();
          const heartGain = ctx.createGain();
          heartOsc.type = 'sine';
          heartOsc.frequency.setValueAtTime(idx % 2 === 0 ? 65 : 50, now + offset);
          heartOsc.frequency.exponentialRampToValueAtTime(25, now + offset + 0.22);
          heartGain.gain.setValueAtTime(0.6, now + offset);
          heartGain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.22);
          heartOsc.connect(heartGain);
          heartGain.connect(ctx.destination);
          heartOsc.start(now + offset);
          heartOsc.stop(now + offset + 0.23);
        });

        // 2. Резкий диссонансный крик ужаса / скример (Sawtooth глиссандо с фильтром)
        [580, 615, 890].forEach(freq => {
          const screamOsc = ctx.createOscillator();
          const screamFilter = ctx.createBiquadFilter();
          const screamGain = ctx.createGain();

          screamOsc.type = 'sawtooth';
          screamOsc.frequency.setValueAtTime(freq, now + 0.45);
          screamOsc.frequency.exponentialRampToValueAtTime(freq * 1.45, now + 0.75);
          screamOsc.frequency.exponentialRampToValueAtTime(190, now + 2.3);

          screamFilter.type = 'bandpass';
          screamFilter.frequency.setValueAtTime(1100, now + 0.45);
          screamFilter.Q.setValueAtTime(4, now + 0.45);

          screamGain.gain.setValueAtTime(0.001, now + 0.45);
          screamGain.gain.linearRampToValueAtTime(0.22, now + 0.55);
          screamGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.35);

          screamOsc.connect(screamFilter);
          screamFilter.connect(screamGain);
          screamGain.connect(ctx.destination);
          screamOsc.start(now + 0.45);
          screamOsc.stop(now + 2.4);
        });

        // 3. Зловещий потусторонний шепот (Белый шум через полосовой фильтр)
        const bufferSize = ctx.sampleRate * 2.5;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }
        const whiteNoise = ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        const whisperFilter = ctx.createBiquadFilter();
        whisperFilter.type = 'bandpass';
        whisperFilter.frequency.setValueAtTime(900, now);
        whisperFilter.frequency.linearRampToValueAtTime(1800, now + 1.2);
        whisperFilter.frequency.linearRampToValueAtTime(600, now + 2.5);
        whisperFilter.Q.setValueAtTime(3.5, now);

        const whisperGain = ctx.createGain();
        whisperGain.gain.setValueAtTime(0.01, now);
        whisperGain.gain.linearRampToValueAtTime(0.18, now + 0.5);
        whisperGain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);

        whiteNoise.connect(whisperFilter);
        whisperFilter.connect(whisperGain);
        whisperGain.connect(ctx.destination);
        whiteNoise.start(now);

        // 4. Похоронный колокол (низкий металлический удар)
        const bellOsc = ctx.createOscillator();
        const bellGain = ctx.createGain();
        bellOsc.type = 'triangle';
        bellOsc.frequency.setValueAtTime(110, now + 0.4);
        bellGain.gain.setValueAtTime(0.5, now + 0.4);
        bellGain.gain.exponentialRampToValueAtTime(0.001, now + 3.2);
        bellOsc.connect(bellGain);
        bellGain.connect(ctx.destination);
        bellOsc.start(now + 0.4);
        bellOsc.stop(now + 3.2);
      } catch (e) {}
    }

    // ==================== ГЛАВНЫЙ КОМПОНЕНТ ПРИЛОЖЕНИЯ ====================
    function App() {
      const [screen, setScreen] = useState('JOIN'); // JOIN, LOBBY, REVEAL, GAME
      const [playerName, setPlayerName] = useState('');
      const [roomIdInput, setRoomIdInput] = useState('');
      const [roomData, setRoomData] = useState(null);
      const [myRole, setMyRole] = useState(null);
      const [isCardFlipped, setIsCardFlipped] = useState(false);

      // Модальное окно справочника роли и карманной карты
      const [inspectedRoleKey, setInspectedRoleKey] = useState(null);
      const [showPocketModal, setShowPocketModal] = useState(false);

      // Чаты и уведомления
      const [globalMessages, setGlobalMessages] = useState([]);
      const [mafiaMessages, setMafiaMessages] = useState([]);
      const [personalAlerts, setPersonalAlerts] = useState([]);
      const [cultMembers, setCultMembers] = useState([]);
      const [mafiaTeam, setMafiaTeam] = useState([]);

      const [globalInput, setGlobalInput] = useState('');
      const [mafiaInput, setMafiaInput] = useState('');

      // Ночные и дневные выборы
      const [primaryTarget, setPrimaryTarget] = useState(null);
      const [secondaryTarget, setSecondaryTarget] = useState(null);
      const [actionConfirmed, setActionConfirmed] = useState(false);
      const [phaseInfo, setPhaseInfo] = useState({ status: 'LOBBY', round: 1, timeLeft: 0, message: '' });
      const [timerLeft, setTimerLeft] = useState(0);

      // Эффект смерти и предсмертное сообщение
      const [deathOverlay, setDeathOverlay] = useState({ active: false, reason: '', canWriteLastWords: false, submitted: false });
      const [lastWordsText, setLastWordsText] = useState('');

      const chatEndRef = useRef(null);

      useEffect(() => {
        socket.on('room:update', (room) => {
          setRoomData(room);
          const me = room.players.find(p => p.id === socket.id);
          if (me && me.role) setMyRole(me.role);
        });

        socket.on('game:error', (msg) => alert(msg));

        socket.on('game:started', (room) => {
          setRoomData(room);
          const me = room.players.find(p => p.id === socket.id);
          setMyRole(me.role);
          setIsCardFlipped(false);
          setDeathOverlay({ active: false, reason: '', canWriteLastWords: false, submitted: false });
          setScreen('REVEAL');
        });

        socket.on('game:phase_change', ({ status, round, timeLeft, message }) => {
          playPhaseChangeSound();
          setPhaseInfo({ status, round: round || 1, timeLeft: timeLeft || 0, message });
          setTimerLeft(timeLeft || 0);
          setPrimaryTarget(null);
          setSecondaryTarget(null);
          setActionConfirmed(false);
        });

        socket.on('chat:global:message', (msg) => {
          setGlobalMessages(prev => [...prev, msg]);
        });

        socket.on('chat:mafia:message', (msg) => {
          setMafiaMessages(prev => [...prev, msg]);
        });

        socket.on('mafia:acquaintance', (team) => {
          setMafiaTeam(team);
        });

        socket.on('cult:update', (members) => {
          setCultMembers(members);
        });

        socket.on('personal:alert', (text) => {
          setPersonalAlerts(prev => [{ id: Date.now() + Math.random(), text }, ...prev]);
        });

        socket.on('mirror:transformed', ({ newRole, donorName }) => {
          setMyRole(newRole);
          setPersonalAlerts(prev => [{
            id: Date.now(),
            text: `🪞 Ваш донор (${donorName}) погиб! Вы скопировали его роль: ${ROLES_CATALOG[newRole]?.name || newRole}`
          }, ...prev]);
        });

        socket.on('player:you_died', ({ reason, timeForLastWords }) => {
          playHorrorDeathSound();
          setDeathOverlay({
            active: true,
            reason,
            canWriteLastWords: timeForLastWords > 0,
            submitted: false
          });
        });

        socket.on('night:action_confirmed', () => {
          setActionConfirmed(true);
        });

        return () => {
          socket.off('room:update');
          socket.off('game:error');
          socket.off('game:started');
          socket.off('game:phase_change');
          socket.off('chat:global:message');
          socket.off('chat:mafia:message');
          socket.off('mafia:acquaintance');
          socket.off('cult:update');
          socket.off('personal:alert');
          socket.off('mirror:transformed');
          socket.off('player:you_died');
          socket.off('night:action_confirmed');
        };
      }, []);

      // Локальный тикер таймера
      useEffect(() => {
        if (timerLeft <= 0) return;
        const interval = setInterval(() => {
          setTimerLeft(prev => (prev > 0 ? prev - 1 : 0));
        }, 1000);
        return () => clearInterval(interval);
      }, [timerLeft]);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [globalMessages]);

      const me = roomData?.players?.find(p => p.id === socket.id);
      const isAlive = me ? me.isAlive : true;
      const myRoleInfo = myRole ? ROLES_CATALOG[myRole] : null;

      // Создание и вход в комнату
      const createRoom = () => {
        if (!playerName.trim()) return alert('Введите ваш никнейм!');
        socket.emit('room:create', { playerName: playerName.trim() }, (res) => {
          if (res.success) {
            setRoomData(res.room);
            setRoomIdInput(res.roomId);
            setScreen('LOBBY');
          }
        });
      };

      const joinRoom = () => {
        if (!playerName.trim() || !roomIdInput.trim()) return alert('Укажите никнейм и код комнаты!');
        socket.emit('room:join', { roomId: roomIdInput.trim(), playerName: playerName.trim() }, (res) => {
          if (res.success) {
            setRoomData(res.room);
            setScreen('LOBBY');
          } else {
            alert(res.message);
          }
        });
      };

      // Изменение количества ролей в колоде хостом
      const updateDeckCount = (roleKey, delta) => {
        if (!roomData || roomData.hostId !== socket.id) return;
        const current = roomData.settings.deck[roleKey] || 0;
        const nextVal = Math.max(0, current + delta);
        const newDeck = { ...roomData.settings.deck, [roleKey]: nextVal };
        socket.emit('room:update_settings', { roomId: roomData.roomId, deck: newDeck });
      };

      const toggleKamikazeFaction = () => {
        if (!roomData || roomData.hostId !== socket.id) return;
        const nextFaction = roomData.settings.kamikazeFaction === 'BLACK' ? 'RED' : 'BLACK';
        socket.emit('room:update_settings', { roomId: roomData.roomId, kamikazeFaction: nextFaction });
      };

      const revealCard = () => {
        if (!isCardFlipped) {
          playCardFlipSound();
          setIsCardFlipped(true);
          socket.emit('player:reveal_card', { roomId: roomData.roomId });
          setTimeout(() => setScreen('GAME'), 3200);
        }
      };

      const sendGlobalChat = (e) => {
        e.preventDefault();
        if (!globalInput.trim()) return;
        socket.emit('chat:global', { roomId: roomData.roomId, message: globalInput });
        setGlobalInput('');
      };

      const sendMafiaChat = (e) => {
        e.preventDefault();
        if (!mafiaInput.trim()) return;
        socket.emit('chat:mafia', { roomId: roomData.roomId, message: mafiaInput });
        setMafiaInput('');
      };

      const submitLastWords = (e) => {
        e.preventDefault();
        socket.emit('player:last_words', { roomId: roomData.roomId, message: lastWordsText });
        setDeathOverlay(prev => ({ ...prev, submitted: true }));
      };

      const submitNightAction = () => {
        if (!primaryTarget) return alert('Выберите основную цель!');
        socket.emit('night:action', {
          roomId: roomData.roomId,
          targetId: primaryTarget,
          secondTargetId: secondaryTarget
        });
      };

      const submitDayVote = (candidateId) => {
        setPrimaryTarget(candidateId);
        socket.emit('day:vote', { roomId: roomData.roomId, targetId: candidateId });
      };

      const submitKamikazeShot = (victimId) => {
        socket.emit('kamikaze:shoot', { roomId: roomData.roomId, targetId: victimId });
      };

      // Вычисляем список задействованных ролей в текущей партии для интерактивной панели
      const activeRolesInMatch = roomData?.settings?.deck
        ? Object.entries(roomData.settings.deck).filter(([_, count]) => count > 0)
        : [];

      const totalDeckCards = activeRolesInMatch.reduce((sum, [_, count]) => sum + count, 0);

      return (
        <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center p-3 md:p-6 ${deathOverlay.active ? 'animate-shake' : ''}`}>

          {/* ==================== КИНЕМАТОГРАФИЧНЫЙ ЭКРАН СМЕРТИ И КАПЛИ КРОВИ ==================== */}
          <AnimatePresence>
            {deathOverlay.active && (
              <motion.div
                initial={{ opacity: 0 }}
                animate={{ opacity: 1 }}
                exit={{ opacity: 0 }}
                className="fixed inset-0 z-50 blood-vignette flex flex-col items-center justify-center p-4 backdrop-blur-sm"
              >
                {/* Стекающие капли крови по краям и верху экрана */}
                {[4, 12, 21, 33, 46, 58, 71, 83, 91, 96].map((leftPos, idx) => (
                  <div
                    key={idx}
                    className="blood-drop"
                    style={{
                      left: `${leftPos}%`,
                      height: `${70 + (idx % 3) * 45}px`,
                      animationDuration: `${2.4 + (idx % 4) * 0.7}s`,
                      animationDelay: `${(idx % 3) * 0.3}s`
                    }}
                  />
                ))}

                <motion.div
                  initial={{ scale: 0.75, y: 20 }}
                  animate={{ scale: 1, y: 0 }}
                  className="max-w-lg w-full bg-zinc-950/95 border-2 border-red-700 rounded-2xl p-6 md:p-8 shadow-[0_0_80px_rgba(220,38,38,0.65)] text-center space-y-5 relative z-10"
                >
                  <div className="text-red-500 text-5xl animate-pulse">🩸</div>
                  <h2 className="text-4xl md:text-5xl font-black tracking-widest text-red-600 drop-shadow-[0_2px_10px_rgba(220,38,38,0.8)]">
                    ВЫ УБИТЫ
                  </h2>
                  <p className="text-sm text-red-300/80 uppercase tracking-wider font-semibold">
                    Причина гибели: {deathOverlay.reason}
                  </p>

                  {deathOverlay.canWriteLastWords && !deathOverlay.submitted ? (
                    <form onSubmit={submitLastWords} className="space-y-4 pt-2 text-left">
                      <label className="block text-xs uppercase tracking-wider text-amber-400 font-bold">
                        ✍️ Предсмертное сообщение городу (осталось {timerLeft} сек):
                      </label>
                      <textarea
                        rows="3"
                        maxLength="220"
                        placeholder="Оставьте улики, результаты проверок или последнее проклятие..."
                        value={lastWordsText}
                        onChange={(e) => setLastWordsText(e.target.value)}
                        className="w-full bg-slate-900 border border-red-800/80 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-red-500"
                      />
                      <button
                        type="submit"
                        className="w-full bg-red-700 hover:bg-red-600 text-white font-bold py-3 rounded-xl shadow-lg transition"
                      >
                        Опубликовать предсмертную записку в чат
                      </button>
                    </form>
                  ) : (
                    <p className="text-xs text-slate-400 bg-slate-900/90 p-3 rounded-xl border border-slate-800">
                      {deathOverlay.submitted
                        ? 'Ваше последнее слово отправлено в общий чат. Теперь вы безмолвный дух.'
                        : 'Вы перешли в режим безмолвного Призрака и можете наблюдать за развязкой партии.'}
                    </p>
                  )}

                  <button
                    onClick={() => setDeathOverlay(prev => ({ ...prev, active: false }))}
                    className="text-xs text-slate-400 hover:text-white underline pt-2"
                  >
                    Скрыть багровый экран и наблюдать за столом
                  </button>
                </motion.div>
              </motion.div>
            )}
          </AnimatePresence>

          {/* ==================== МОДАЛЬНОЕ ОКНО ОПИСАНИЯ РОЛИ ==================== */}
          <AnimatePresence>
            {inspectedRoleKey && ROLES_CATALOG[inspectedRoleKey] && (
              <motion.div
                initial={{ opacity: 0 }}
                animate={{ opacity: 1 }}
                exit={{ opacity: 0 }}
                onClick={() => setInspectedRoleKey(null)}
                className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4"
              >
                <motion.div
                  initial={{ scale: 0.9, y: 10 }}
                  animate={{ scale: 1, y: 0 }}
                  exit={{ scale: 0.9, y: 10 }}
                  onClick={(e) => e.stopPropagation()}
                  className="max-w-md w-full bg-slate-900 border border-amber-500/40 rounded-2xl p-6 shadow-2xl space-y-4"
                >
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                    <div className="flex items-center gap-3">
                      <span className="text-4xl">{ROLES_CATALOG[inspectedRoleKey].icon}</span>
                      <div>
                        <h3 className="text-xl font-bold text-white">{ROLES_CATALOG[inspectedRoleKey].name}</h3>
                        <span className={`inline-block text-xs px-2.5 py-0.5 rounded-full border mt-1 ${ROLES_CATALOG[inspectedRoleKey].badgeClass}`}>
                          {ROLES_CATALOG[inspectedRoleKey].factionLabel}
                        </span>
                      </div>
                    </div>
                    <button
                      onClick={() => setInspectedRoleKey(null)}
                      className="text-slate-400 hover:text-white text-xl font-bold px-2"
                    >
                      ✕
                    </button>
                  </div>

                  <div className="space-y-3 text-sm leading-relaxed">
                    <div className="bg-slate-950/90 p-3.5 rounded-xl border border-slate-800">
                      <div className="text-xs uppercase tracking-wider text-amber-400 font-bold mb-1">Способность и механика:</div>
                      <p className="text-slate-200">{ROLES_CATALOG[inspectedRoleKey].description}</p>
                    </div>
                    <div className="bg-slate-950/90 p-3.5 rounded-xl border border-slate-800">
                      <div className="text-xs uppercase tracking-wider text-emerald-400 font-bold mb-1">Условие победы:</div>
                      <p className="text-slate-200">{ROLES_CATALOG[inspectedRoleKey].winCondition}</p>
                    </div>
                  </div>

                  <button
                    onClick={() => setInspectedRoleKey(null)}
                    className="w-full bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold py-2.5 rounded-xl transition"
                  >
                    Понятно
                  </button>
                </motion.div>
              </motion.div>
            )}
          </AnimatePresence>

          {/* ==================== ЭКРАН 1: ВХОД И СОЗДАНИЕ КОМНАТЫ ==================== */}
          {screen === 'JOIN' && (
            <div className="my-auto max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl space-y-6">
              <div className="text-center space-y-1">
                <span className="text-xs uppercase tracking-widest px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">
                  Extended Edition • 16 Ролей
                </span>
                <h1 className="text-3xl font-extrabold tracking-wider text-amber-500 pt-2">МАФИЯ ONLINE</h1>
                <p className="text-xs text-slate-400">Карточная механика, Секта, Некромант, Кукловод и Предсмертные записки</p>
              </div>

              <div className="space-y-4">
                <input
                  type="text"
                  placeholder="Ваш игровой никнейм"
                  value={playerName}
                  onChange={e => setPlayerName(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 focus:outline-none focus:border-amber-500"
                />
                <input
                  type="text"
                  placeholder="Код комнаты (если пригласил друг)"
                  value={roomIdInput}
                  onChange={e => setRoomIdInput(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 uppercase focus:outline-none focus:border-amber-500"
                />
                <button
                  onClick={joinRoom}
                  className="w-full bg-slate-800 hover:bg-slate-700 font-semibold py-3 rounded-xl transition"
                >
                  Войти по коду комнаты
                </button>
                <div className="relative flex py-1 items-center">
                  <div className="flex-grow border-t border-slate-800"></div>
                  <span className="flex-shrink mx-3 text-slate-500 text-xs uppercase">или</span>
                  <div className="flex-grow border-t border-slate-800"></div>
                </div>
                <button
                  onClick={createRoom}
                  className="w-full bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg"
                >
                  Создать новое лобби (Хост)
                </button>
              </div>
            </div>
          )}

          {/* ==================== ЭКРАН 2: ЛОББИ И КАСТОМИЗАЦИЯ РОЛЕЙ ==================== */}
          {screen === 'LOBBY' && roomData && (
            <div className="max-w-5xl w-full grid grid-cols-1 lg:grid-cols-3 gap-6 my-auto">
              {/* Левая панель: Код комнаты и список подключенных игроков */}
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-5 flex flex-col justify-between">
                <div className="space-y-4">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                    <div>
                      <span className="text-xs text-amber-500 font-bold uppercase">Код приглашения</span>
                      <h2 className="text-3xl font-mono font-black tracking-wider text-white">{roomData.roomId}</h2>
                    </div>
                    <div className="text-right">
                      <span className="text-xs text-slate-400">Игроков / Карт</span>
                      <p className={`text-xl font-bold ${roomData.players.length === totalDeckCards ? 'text-emerald-400' : 'text-amber-400'}`}>
                        {roomData.players.length} / {totalDeckCards}
                      </p>
                    </div>
                  </div>

                  <div className="space-y-2">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">Участники за столом:</h3>
                    <div className="space-y-1.5 max-h-64 overflow-y-auto pr-1">
                      {roomData.players.map(p => (
                        <div key={p.id} className="bg-slate-950 px-3.5 py-2.5 rounded-xl border border-slate-800 flex justify-between items-center text-sm">
                          <span className="font-medium">{p.name} {p.id === socket.id && '(Вы)'}</span>
                          {p.isHost && <span className="text-xs bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded font-semibold">Ведущий</span>}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                {roomData.hostId === socket.id ? (
                  <button
                    onClick={() => socket.emit('game:start', { roomId: roomData.roomId })}
                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg"
                  >
                    🚀 Раздать карточки и начать ({totalDeckCards})
                  </button>
                ) : (
                  <div className="text-center text-xs text-slate-400 bg-slate-950 p-3 rounded-xl border border-slate-800">
                    Ожидаем, пока хост настроит колоду и запустит партию...
                  </div>
                )}
              </div>

              {/* Правая панель: Конструктор колоды ролей с интерактивным кликом */}
              <div className="lg:col-span-2 bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4">
                <div className="flex flex-wrap justify-between items-center gap-2 border-b border-slate-800 pb-3">
                  <div>
                    <h3 className="text-lg font-bold text-white">Настройка колоды ролей</h3>
                    <p className="text-xs text-slate-400">Нажмите на название любой роли, чтобы прочитать её правила и условия победы</p>
                  </div>
                  <button
                    onClick={toggleKamikazeFaction}
                    className="text-xs px-3 py-1.5 rounded-lg border border-orange-500/40 bg-orange-950/40 text-orange-300 hover:bg-orange-900/50 transition"
                  >
                    Фракция Камикадзе: {roomData.settings.kamikazeFaction === 'BLACK' ? 'ЧЕРНЫЙ (За Мафию)' : 'КРАСНЫЙ (За Мирных)'}
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-h-[430px] overflow-y-auto pr-1">
                  {Object.entries(ROLES_CATALOG).map(([roleKey, info]) => {
                    const count = roomData.settings.deck[roleKey] || 0;
                    const isHost = roomData.hostId === socket.id;
                    return (
                      <div
                        key={roleKey}
                        className={`p-3 rounded-xl border flex items-center justify-between transition ${
                          count > 0 ? 'bg-slate-950 border-amber-500/40' : 'bg-slate-950/40 border-slate-800/80 opacity-65'
                        }`}
                      >
                        <button
                          type="button"
                          onClick={() => setInspectedRoleKey(roleKey)}
                          className="flex items-center gap-2.5 text-left group"
                        >
                          <span className="text-2xl">{info.icon}</span>
                          <div>
                            <div className="text-sm font-bold text-slate-100 group-hover:text-amber-400 underline decoration-dotted underline-offset-4">
                              {info.name}
                            </div>
                            <div className="text-[11px] text-slate-400">{info.factionLabel}</div>
                          </div>
                        </button>

                        <div className="flex items-center gap-2">
                          {isHost && (
                            <button
                              onClick={() => updateDeckCount(roleKey, -1)}
                              className="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 font-bold text-sm"
                            >
                              -
                            </button>
                          )}
                          <span className="w-6 text-center font-mono font-bold text-amber-400">{count}</span>
                          {isHost && (
                            <button
                              onClick={() => updateDeckCount(roleKey, 1)}
                              className="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 font-bold text-sm"
                            >
                              +
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* ==================== ЭКРАН 3: 3D-ВСКРЫТИЕ КАРТОЧКИ РОЛИ ==================== */}
          {screen === 'REVEAL' && myRoleInfo && (
            <div className="my-auto flex flex-col items-center justify-center space-y-6">
              <h2 className="text-2xl font-bold tracking-wide text-amber-400">Ваша секретная карта роли</h2>
              <div className="perspective-1000 w-72 h-96 cursor-pointer" onClick={revealCard}>
                <motion.div
                  className="w-full h-full relative preserve-3d rounded-2xl shadow-2xl"
                  animate={{ rotateY: isCardFlipped ? 180 : 0 }}
                  transition={{ duration: 0.75, type: 'spring', stiffness: 140 }}
                >
                  {/* Рубашка карты */}
                  <div className="absolute inset-0 w-full h-full backface-hidden bg-gradient-to-br from-slate-900 to-zinc-950 rounded-2xl flex flex-col items-center justify-center border-4 border-amber-500/40 p-6 text-center">
                    <span className="text-6xl mb-4 text-amber-500">♠</span>
                    <p className="text-amber-200 font-bold tracking-widest text-sm uppercase">Тапните по карте, чтобы вскрыть</p>
                    <p className="text-xs text-slate-500 mt-2">Игра начнется, когда все участники посмотрят свои карты</p>
                  </div>

                  {/* Лицевая сторона с ролью */}
                  <div className="absolute inset-0 w-full h-full backface-hidden rotateY-180 bg-gradient-to-b from-slate-900 via-slate-950 to-zinc-900 rounded-2xl p-6 flex flex-col items-center justify-between border-4 border-amber-500">
                    <div className="text-center">
                      <span className="text-4xl">{myRoleInfo.icon}</span>
                      <h3 className="text-2xl font-extrabold uppercase text-white mt-2">{myRoleInfo.
