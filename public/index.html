<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мафия Online — Расширенное Издание</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <style>
    .perspective-1000 { perspective: 1000px; }
    .preserve-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotateY-180 { transform: rotateY(180deg); }
    .card-inner { transition: transform 0.75s cubic-bezier(.2,.8,.2,1); }

    @keyframes bloodDrip {
      0% { transform: translateY(-100%) scaleY(0.8); opacity: 0.9; }
      70% { opacity: 0.95; }
      100% { transform: translateY(105vh) scaleY(1.6); opacity: 0; }
    }
    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-8px, -6px) rotate(-1deg); }
      30% { transform: translate(8px, 4px) rotate(1deg); }
      45% { transform: translate(-6px, 6px) rotate(-0.5deg); }
      60% { transform: translate(6px, -4px) rotate(0.5deg); }
      75% { transform: translate(-4px, 2px) rotate(0deg); }
    }
    @keyframes fadeIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
    .animate-shake { animation: screenShake 0.65s cubic-bezier(.36,.07,.19,.97) both; }
    .fade-in { animation: fadeIn .25s ease-out both; }
    .blood-drop {
      position: fixed; top: 0; width: 6px;
      background: linear-gradient(180deg, #450a0a 0%, #991b1b 60%, #ef4444 100%);
      border-radius: 0 0 9999px 9999px;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.8);
      pointer-events: none; z-index: 60;
      animation: bloodDrip linear infinite;
    }
    .blood-vignette { background: radial-gradient(circle, rgba(0,0,0,0.4) 30%, rgba(127,29,29,0.85) 100%); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    const socket = io();

    // ---------- Каталог ролей ----------
    const BADGE = {
      RED: 'bg-emerald-950/80 text-emerald-300 border-emerald-700/50',
      BLACK: 'bg-red-950/80 text-red-300 border-red-700/50',
      KAMI: 'bg-orange-950/80 text-orange-300 border-orange-700/50',
      NEUTRAL: 'bg-purple-950/80 text-purple-300 border-purple-700/50',
      CULT: 'bg-fuchsia-950/80 text-fuchsia-300 border-fuchsia-700/50',
      PUPPET: 'bg-indigo-950/80 text-indigo-300 border-indigo-700/50',
      MIRROR: 'bg-cyan-950/80 text-cyan-300 border-cyan-700/50'
    };
    const RED_LABEL = 'Мирный город (Красные)';
    const BLACK_LABEL = 'Синдикат Мафии (Черные)';

    const ROLES_CATALOG = {
      civilian: { name: 'Мирный житель', icon: '🧑', factionLabel: RED_LABEL, badgeClass: BADGE.RED, targetMode: 'NONE',
        description: 'Не имеет активных ночных способностей. Главная сила — логика, анализ поведения игроков в дневном чате и участие в голосовании.',
        winCondition: 'Побеждает, когда все члены Мафии и Некромант уничтожены.' },
      lucky: { name: 'Счастливчик', icon: '🍀', factionLabel: RED_LABEL, badgeClass: BADGE.RED, targetMode: 'NONE',
        description: 'Пассивный навык «Удача»: если ночью мафия стреляет в него, шанс выжить — 50%. При успехе Счастливчик остается жив, а мафия считает выстрел состоявшимся.',
        winCondition: 'Побеждает вместе с мирными жителями.' },
      commissar: { name: 'Комиссар (Шериф)', icon: '🕵️', factionLabel: RED_LABEL, badgeClass: BADGE.RED, targetMode: 'SINGLE_ALIVE',
        description: 'Каждую ночь проверяет одного игрока на принадлежность к мафии. Если игрока в эту же ночь подставил Подстрекатель, Комиссар увидит «Черный» статус.',
        winCondition: 'Побеждает вместе с мирными жителями.' },
      doctor: { name: 'Доктор', icon: '⚕️', factionLabel: RED_LABEL, badgeClass: BADGE.RED, targetMode: 'SINGLE_ALIVE',
        description: 'Каждую ночь выбирает игрока, которого спасает от смертельного покушения. Одного и того же человека (включая себя) нельзя лечить две ночи подряд.',
        winCondition: 'Побеждает вместе с мирными жителями.' },
      hooker: { name: 'Любовница (Путана)', icon: '💋', factionLabel: RED_LABEL, badgeClass: BADGE.RED, targetMode: 'SINGLE_ALIVE',
        description: 'Каждую ночь блокирует активную способность выбранного игрока (лишает хода Доктора, Шерифа, Кукловода или стрелка Мафии).',
        winCondition: 'Побеждает вместе с мирными жителями.' },
      hobo: { name: 'Бомж (Свидетель)', icon: '🍾', factionLabel: RED_LABEL, badgeClass: BADGE.RED, targetMode: 'SINGLE_ALIVE',
        description: 'Каждую ночь следит за домом одного игрока и под утро узнает имена всех, кто приходил к этому объекту ночью.',
        winCondition: 'Побеждает вместе с мирными жителями.' },
      journalist: { name: 'Журналист', icon: '📰', factionLabel: RED_LABEL, badgeClass: BADGE.RED, targetMode: 'DOUBLE_ALIVE',
        description: 'Ночью выбирает двух игроков и узнает, принадлежат ли они к ОДНОЙ фракции или к РАЗНЫМ, без раскрытия ролей. Нейтралы-одиночки всегда «Разные».',
        winCondition: 'Побеждает вместе с мирными жителями.' },
      kamikaze: { name: 'Камикадзе', icon: '💣', factionLabel: 'Настраиваемая (Мирный или Мафия)', badgeClass: BADGE.KAMI, targetMode: 'NONE',
        description: 'Навык «Последнее слово»: если днем город казнит его голосованием, Камикадзе перед смертью забирает с собой в могилу любого выбранного игрока.',
        winCondition: 'Зависит от настройки ведущего в лобби (за Город или за Мафию).' },
      mafia: { name: 'Мафия (Рядовой)', icon: '🦹‍♂️', factionLabel: BLACK_LABEL, badgeClass: BADGE.BLACK, targetMode: 'SINGLE_ALIVE',
        description: 'Участвует в закрытом ночном чате мафии и голосует за устранение жертвы каждую ночь.',
        winCondition: 'Побеждает, когда количество мафии сравнивается с числом остальных выживших.' },
      don: { name: 'Дон Мафии', icon: '🎩', factionLabel: BLACK_LABEL, badgeClass: BADGE.BLACK, targetMode: 'DOUBLE_ALIVE',
        description: 'Глава мафии. Ночью участвует в выстреле (Цель 1) и дополнительно проверяет одного игрока на роль Комиссара (Цель 2, необязательно).',
        winCondition: 'Побеждает вместе с синдикатом Мафии.' },
      instigator: { name: 'Подстрекатель (Лжесвидетель)', icon: '🐍', factionLabel: BLACK_LABEL, badgeClass: BADGE.BLACK, targetMode: 'SINGLE_ALIVE',
        description: 'Один раз за партию подбрасывает улики против выбранного игрока. Если в эту ночь Комиссар или Журналист проверят его, он будет показан как «Черный».',
        winCondition: 'Побеждает вместе с синдикатом Мафии.' },
      suicider: { name: 'Самоубийца', icon: '🃏', factionLabel: 'Нейтрал-одиночка', badgeClass: BADGE.NEUTRAL, targetMode: 'NONE',
        description: 'Не имеет ночных ходов. Должен вести себя подозрительно и добиться собственной казни на дневном голосовании. Если его убивают ночью — он проигрывает.',
        winCondition: 'Мгновенная сольная победа, если город казнит его днем!' },
      necromancer: { name: 'Некромант', icon: '🔮', factionLabel: 'Нейтрал-одиночка', badgeClass: BADGE.NEUTRAL, targetMode: 'DEAD_AND_ALIVE',
        description: 'Каждую ночь выбирает погибшего игрока (Цель 1) и на одну ночь воскрешает его способность, направляя ее на живого игрока (Цель 2). Работают: Мафия, Дон, Камикадзе (убийство), Доктор (лечение), Любовница (блок), Комиссар (проверка).',
        winCondition: 'Остаться последним выжившим среди всех игроков за столом.' },
      cultist: { name: 'Сектант (Проповедник)', icon: '🕯️', factionLabel: 'Тайный Культ Секты', badgeClass: BADGE.CULT, targetMode: 'SINGLE_ALIVE',
        description: 'Каждую ночь вербует одного живого игрока в свой культ. Завербованные сохраняют свои роли. Если Сектанта убивают или казнят — культ распадается.',
        winCondition: 'Побеждает, когда все выжившие за столом состоят в секте.' },
      puppeteer: { name: 'Кукловод', icon: '🎭', factionLabel: 'Нейтрал / Манипулятор', badgeClass: BADGE.PUPPET, targetMode: 'DOUBLE_ALIVE',
        description: 'Ночью выбирает Марионетку (Цель 1) и Новую мишень (Цель 2). Если Марионетка использует активное действие, оно перенаправляется на новую мишень.',
        winCondition: 'Выжить и манипулировать столом.' },
      mirror: { name: 'Зеркало (Хамелеон)', icon: '🪞', factionLabel: 'Нейтрал-трансформер', badgeClass: BADGE.MIRROR, targetMode: 'FIRST_NIGHT_ONLY',
        description: 'В первую ночь выбирает игрока-донора. До его гибели считается мирным жителем. Как только донор погибает, Зеркало копирует его роль и фракцию.',
        winCondition: 'Побеждает с той фракцией, чью роль скопировало.' }
    };

    const PHASE_LABELS = {
      LOBBY: 'Лобби', ROLE_REVEAL: 'Раздача ролей', FIRST_NIGHT_INTRO: 'Знакомство мафии',
      NIGHT: 'Ночь', MORNING_LAST_WORDS: 'Утро', DAY: 'День', VOTING: 'Голосование',
      KAMIKAZE_REVENGE: 'Месть Камикадзе', GAME_OVER: 'Конец игры'
    };

    // ---------- Звуки ----------
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function tone(type, f0, f1, dur, vol) {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f0, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(f1, ctx.currentTime + dur);
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }
    const playCardFlipSound = () => tone('sine', 420, 90, 0.09, 0.25);
    const playPhaseChangeSound = () => tone('triangle', 140, 65, 0.55, 0.25);

    function playHorrorDeathSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        [0, 0.28, 0.85, 1.12].forEach((offset, idx) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(idx % 2 === 0 ? 65 : 50, now + offset);
          o.frequency.exponentialRampToValueAtTime(25, now + offset + 0.22);
          g.gain.setValueAtTime(0.6, now + offset);
          g.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.22);
          o.connect(g); g.connect(ctx.destination);
          o.start(now + offset); o.stop(now + offset + 0.23);
        });

        [580, 615, 890].forEach(freq => {
          const o = ctx.createOscillator();
          const f = ctx.createBiquadFilter();
          const g = ctx.createGain();
          o.type = 'sawtooth';
          o.frequency.setValueAtTime(freq, now + 0.45);
          o.frequency.exponentialRampToValueAtTime(freq * 1.45, now + 0.75);
          o.frequency.exponentialRampToValueAtTime(190, now + 2.3);
          f.type = 'bandpass';
          f.frequency.setValueAtTime(1100, now + 0.45);
          f.Q.setValueAtTime(4, now + 0.45);
          g.gain.setValueAtTime(0.001, now + 0.45);
          g.gain.linearRampToValueAtTime(0.22, now + 0.55);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 2.35);
          o.connect(f); f.connect(g); g.connect(ctx.destination);
          o.start(now + 0.45); o.stop(now + 2.4);
        });

        const size = Math.floor(ctx.sampleRate * 2.5);
        const buf = ctx.createBuffer(1, size, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;
        const noise = ctx.createBufferSource();
        noise.buffer = buf;
        const nf = ctx.createBiquadFilter();
        nf.type = 'bandpass';
        nf.frequency.setValueAtTime(900, now);
        nf.frequency.linearRampToValueAtTime(1800, now + 1.2);
        nf.frequency.linearRampToValueAtTime(600, now + 2.5);
        nf.Q.setValueAtTime(3.5, now);
        const ng = ctx.createGain();
        ng.gain.setValueAtTime(0.01, now);
        ng.gain.linearRampToValueAtTime(0.18, now + 0.5);
        ng.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
        noise.connect(nf); nf.connect(ng); ng.connect(ctx.destination);
        noise.start(now);

        const bell = ctx.createOscillator();
        const bg = ctx.createGain();
        bell.type = 'triangle';
        bell.frequency.setValueAtTime(110, now + 0.4);
        bg.gain.setValueAtTime(0.5, now + 0.4);
        bg.gain.exponentialRampToValueAtTime(0.001, now + 3.2);
        bell.connect(bg); bg.connect(ctx.destination);
        bell.start(now + 0.4); bell.stop(now + 3.2);
      } catch (e) {}
    }

    // ---------- Приложение ----------
    function App() {
      const [screen, setScreen] = useState('JOIN');
      const [playerName, setPlayerName] = useState('');
      const [roomIdInput, setRoomIdInput] = useState('');
      const [roomData, setRoomData] = useState(null);
      const [myRole, setMyRole] = useState(null);
      const [isCardFlipped, setIsCardFlipped] = useState(false);
      const [inspectedRoleKey, setInspectedRoleKey] = useState(null);

      const [globalMessages, setGlobalMessages] = useState([]);
      const [mafiaMessages, setMafiaMessages] = useState([]);
      const [personalAlerts, setPersonalAlerts] = useState([]);
      const [cultMembers, setCultMembers] = useState([]);
      const [mafiaTeam, setMafiaTeam] = useState([]);
      const [globalInput, setGlobalInput] = useState('');
      const [mafiaInput, setMafiaInput] = useState('');

      const [primaryTarget, setPrimaryTarget] = useState(null);
      const [secondaryTarget, setSecondaryTarget] = useState(null);
      const [actionConfirmed, setActionConfirmed] = useState(false);
      const [phaseInfo, setPhaseInfo] = useState({ status: 'LOBBY', round: 1, message: '' });
      const [timerLeft, setTimerLeft] = useState(0);
      const endRef = useRef(0);

      const [deathOverlay, setDeathOverlay] = useState({ active: false, reason: '', canWriteLastWords: false, submitted: false });
      const [lastWordsText, setLastWordsText] = useState('');
      const [gameOver, setGameOver] = useState(null);

      const chatEndRef = useRef(null);
      const revealTimeoutRef = useRef(null);

      const resetGameState = () => {
        setGlobalMessages([]); setMafiaMessages([]); setPersonalAlerts([]);
        setCultMembers([]); setMafiaTeam([]);
        setPrimaryTarget(null); setSecondaryTarget(null); setActionConfirmed(false);
        setDeathOverlay({ active: false, reason: '', canWriteLastWords: false, submitted: false });
        setLastWordsText(''); setGameOver(null); setIsCardFlipped(false);
        setPhaseInfo({ status: 'LOBBY', round: 1, message: '' });
        setTimerLeft(0); endRef.current = 0;
      };

      useEffect(() => {
        socket.on('room:update', (room) => {
          setRoomData(room);
          const me = room.players.find(p => p.id === socket.id);
          if (me && me.role) setMyRole(me.role);
        });
        socket.on('game:error', (msg) => alert(msg));

        socket.on('game:started', (room) => {
          resetGameState();
          setRoomData(room);
          const me = room.players.find(p => p.id === socket.id);
          setMyRole(me ? me.role : null);
          setScreen('REVEAL');
        });

        socket.on('game:restarted', () => {
          clearTimeout(revealTimeoutRef.current);
          resetGameState();
          setMyRole(null);
          setScreen('LOBBY');
        });

        socket.on('game:phase_change', ({ status, round, timeLeft, message }) => {
          playPhaseChangeSound();
          setPhaseInfo({ status, round: round || 1, message });
          endRef.current = Date.now() + (timeLeft || 0) * 1000;
          setTimerLeft(timeLeft || 0);
          setPrimaryTarget(null);
          setSecondaryTarget(null);
          setActionConfirmed(false);
        });

        socket.on('game:over', ({ winner }) => setGameOver({ winner }));
        socket.on('chat:global:message', (msg) => setGlobalMessages(prev => [...prev, msg]));
        socket.on('chat:mafia:message', (msg) => setMafiaMessages(prev => [...prev, msg]));
        socket.on('mafia:acquaintance', (team) => setMafiaTeam(team));
        socket.on('cult:update', (members) => setCultMembers(members));
        socket.on('personal:alert', (text) => {
          setPersonalAlerts(prev => [{ id: Date.now() + Math.random(), text }, ...prev]);
        });
        socket.on('mirror:transformed', ({ newRole, donorName }) => {
          setMyRole(newRole);
          setPersonalAlerts(prev => [{
            id: Date.now() + Math.random(),
            text: `🪞 Ваш донор (${donorName}) погиб! Вы скопировали его роль: ${ROLES_CATALOG[newRole]?.name || newRole}`
          }, ...prev]);
        });
        socket.on('player:you_died', ({ reason, timeForLastWords }) => {
          playHorrorDeathSound();
          setDeathOverlay({ active: true, reason, canWriteLastWords: timeForLastWords > 0, submitted: false });
        });
        socket.on('night:action_confirmed', () => setActionConfirmed(true));

        return () => {
          ['room:update', 'game:error', 'game:started', 'game:restarted', 'game:phase_change', 'game:over',
           'chat:global:message', 'chat:mafia:message', 'mafia:acquaintance', 'cult:update',
           'personal:alert', 'mirror:transformed', 'player:you_died', 'night:action_confirmed']
            .forEach(ev => socket.off(ev));
        };
      }, []);

      // Таймер считается от времени окончания фазы — без дрейфа
      useEffect(() => {
        const interval = setInterval(() => {
          setTimerLeft(Math.max(0, Math.ceil((endRef.current - Date.now()) / 1000)));
        }, 250);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [globalMessages]);

      const me = roomData?.players?.find(p => p.id === socket.id);
      const isAlive = me ? me.isAlive : true;
      const isHost = roomData?.hostId === socket.id;
      const myRoleInfo = myRole ? ROLES_CATALOG[myRole] : null;
      const isBlackTeam = me?.faction === 'BLACK';

      const createRoom = () => {
        if (!playerName.trim()) return alert('Введите ваш никнейм!');
        socket.emit('room:create', { playerName: playerName.trim() }, (res) => {
          if (res.success) { setRoomData(res.room); setRoomIdInput(res.roomId); setScreen('LOBBY'); }
        });
      };

      const joinRoom = () => {
        if (!playerName.trim() || !roomIdInput.trim()) return alert('Укажите никнейм и код комнаты!');
        socket.emit('room:join', { roomId: roomIdInput.trim(), playerName: playerName.trim() }, (res) => {
          if (res.success) { setRoomData(res.room); setScreen('LOBBY'); }
          else alert(res.message);
        });
      };

      const updateDeckCount = (roleKey, delta) => {
        if (!isHost) return;
        const current = roomData.settings.deck[roleKey] || 0;
        const newDeck = { ...roomData.settings.deck, [roleKey]: Math.max(0, current + delta) };
        socket.emit('room:update_settings', { roomId: roomData.roomId, deck: newDeck });
      };

      const toggleKamikazeFaction = () => {
        if (!isHost) return;
        const next = roomData.settings.kamikazeFaction === 'BLACK' ? 'RED' : 'BLACK';
        socket.emit('room:update_settings', { roomId: roomData.roomId, kamikazeFaction: next });
      };

      const revealCard = () => {
        if (isCardFlipped) return;
        playCardFlipSound();
        setIsCardFlipped(true);
        socket.emit('player:reveal_card', { roomId: roomData.roomId });
        revealTimeoutRef.current = setTimeout(() => setScreen('GAME'), 3200);
      };

      const sendGlobalChat = (e) => {
        e.preventDefault();
        if (!globalInput.trim()) return;
        socket.emit('chat:global', { roomId: roomData.roomId, message: globalInput });
        setGlobalInput('');
      };

      const sendMafiaChat = (e) => {
        e.preventDefault();
        if (!mafiaInput.trim()) return;
        socket.emit('chat:mafia', { roomId: roomData.roomId, message: mafiaInput });
        setMafiaInput('');
      };

      const submitLastWords = (e) => {
        e.preventDefault();
        socket.emit('player:last_words', { roomId: roomData.roomId, message: lastWordsText });
        setDeathOverlay(prev => ({ ...prev, submitted: true }));
      };

      const needsSecond = myRole === 'journalist' || myRole === 'puppeteer' || myRole === 'necromancer';

      const submitNightAction = () => {
        if (!primaryTarget) return alert('Выберите основную цель!');
        if (needsSecond && !secondaryTarget) return alert('Выберите вторую цель!');
        socket.emit('night:action', {

                  )}

                  {/* Голосование */}
                  {phaseInfo.status === 'VOTING' && isAlive && (
                    <div className="bg-slate-900 border border-amber-500/40 rounded-2xl p-5 space-y-3">
                      <h3 className="text-sm font-bold uppercase tracking-wider text-amber-400">⚖️ Дневное голосование (выберите подозреваемого):</h3>
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                        {roomData.players.filter(p => p.isAlive).map(p => (
                          <button key={p.id} onClick={() => submitDayVote(p.id)}
                            className={`p-3 rounded-xl border text-sm font-semibold transition ${
                              primaryTarget === p.id ? 'bg-amber-500/20 border-amber-500 text-amber-300' : 'bg-slate-950 border-slate-800 hover:border-slate-700'}`}>
                            {p.name}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Ночные действия */}
                  {phaseInfo.status === 'NIGHT' && isAlive && myRoleInfo && myRoleInfo.targetMode !== 'NONE' && (
                    <div className="bg-slate-900 border border-indigo-500/40 rounded-2xl p-5 space-y-4">
                      <div className="flex justify-between items-center">
                        <h3 className="text-sm font-bold uppercase tracking-wider text-indigo-300">
                          🌙 Ночной ход: {myRoleInfo.icon} {myRoleInfo.name}
                        </h3>
                        {actionConfirmed && (
                          <span className="text-xs px-2.5 py-1 rounded-full bg-emerald-950 text-emerald-300 border border-emerald-700/50">✓ Выбор принят</span>
                        )}
                      </div>

                      {myRole === 'mirror' && phaseInfo.round > 1 ? (
                        <p className="text-xs text-slate-400">Вы уже выбрали донора в первую ночь. Ожидайте его судьбы.</p>
                      ) : (
                        <>
                          <div className="space-y-2">
                            <span className="text-xs text-slate-400 font-semibold">{primaryLabel}</span>
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                              {roomData.players
                                .filter(p => myRole === 'necromancer' ? !p.isAlive : (p.isAlive && !(myRole === 'mirror' && p.id === socket.id)))
                                .map(p => (
                                  <button key={p.id} onClick={() => setPrimaryTarget(p.id)}
                                    className={`p-2.5 rounded-xl border text-xs font-semibold transition ${
                                      primaryTarget === p.id ? 'bg-indigo-600/30 border-indigo-400 text-indigo-200' : 'bg-slate-950 border-slate-800 hover:border-slate-700'}`}>
                                    {p.name} {!p.isAlive && p.role && `(${ROLES_CATALOG[p.role]?.name || p.role})`}
                                  </button>
                                ))}
                            </div>
                          </div>

                          {['DOUBLE_ALIVE', 'DEAD_AND_ALIVE'].includes(myRoleInfo.targetMode) && (
                            <div className="space-y-2 pt-2 border-t border-slate-800">
                              <span className="text-xs text-slate-400 font-semibold">{secondaryLabel}</span>
                              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                {roomData.players.filter(p => p.isAlive).map(p => (
                                  <button key={p.id} onClick={() => setSecondaryTarget(p.id)}
                                    className={`p-2.5 rounded-xl border text-xs font-semibold transition ${
                                      secondaryTarget === p.id ? 'bg-amber-500/20 border-amber-400 text-amber-200' : 'bg-slate-950 border-slate-800 hover:border-slate-700'}`}>
                                    {p.name}
                                  </button>
                                ))}
                              </div>
                            </div>
                          )}

                          <button onClick={submitNightAction}
                            className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-sm transition">
                            Подтвердить ночной ход
                          </button>
                        </>
                      )}
                    </div>
                  )}

                  {/* Общий чат */}
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                    <div className="flex justify-between items-center">
                      <h3 className="text-sm font-bold uppercase tracking-wider text-slate-300">💬 Городской чат и Хроника событий</h3>
                      {!isAlive && (
                        <span className="text-xs px-2.5 py-0.5 rounded bg-red-950 text-red-400 border border-red-800">Режим Призрака</span>
                      )}
                    </div>

                    <div className="h-64 bg-slate-950 rounded-xl p-4 overflow-y-auto space-y-2.5 border border-slate-800">
                      {globalMessages.map(msg => {
                        if (msg.type === 'system') {
                          return <div key={msg.id} className="text-xs text-amber-300/90 bg-amber-500/10 border border-amber-500/20 px-3 py-2 rounded-lg">{msg.message}</div>;
                        }
                        if (msg.type === 'last_words') {
                          return (
                            <div key={msg.id} className="text-xs bg-red-950/60 border-2 border-red-600/80 text-red-200 p-3 rounded-xl shadow-md">
                              <div className="font-black text-red-400 uppercase tracking-wider mb-1">🩸 Предсмертная записка ({msg.senderName}):</div>
                              <p className="italic text-white">«{msg.message}»</p>
                            </div>
                          );
                        }
                        return (
                          <div key={msg.id} className="text-sm">
                            <span className="font-bold text-emerald-400">{msg.senderName}: </span>
                            <span className="text-slate-200">{msg.message}</span>
                          </div>
                        );
                      })}
                      <div ref={chatEndRef} />
                    </div>

                    {isAlive && ['DAY', 'VOTING'].includes(phaseInfo.status) ? (
                      <form onSubmit={sendGlobalChat} className="flex gap-2">
                        <input type="text" placeholder="Напишите сообщение городу..." value={globalInput}
                          onChange={e => setGlobalInput(e.target.value)}
                          className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500" />
                        <button type="submit" className="bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-sm transition">Отправить</button>
                      </form>
                    ) : (
                      <div className="text-xs text-center text-slate-500 py-2 bg-slate-950 rounded-xl border border-slate-800">
                        {!isAlive ? '💀 Мертвые не разговаривают. Вы наблюдаете за игрой.' : '🌙 Сейчас городской чат закрыт.'}
                      </div>
                    )}
                  </div>

                  {/* Чат мафии */}
                  {isAlive && isBlackTeam && phaseInfo.status === 'NIGHT' && (
                    <div className="bg-slate-900 border border-red-900/60 rounded-2xl p-5 space-y-3">
                      <h3 className="text-sm font-bold uppercase tracking-wider text-red-400">🦹‍♂️ Закрытый ночной радиоканал Мафии</h3>
                      <div className="h-36 bg-slate-950 p-3.5 rounded-xl overflow-y-auto space-y-1.5 border border-red-950">
                        {mafiaMessages.map((m, idx) => (
                          <div key={idx} className="text-xs">
                            <span className="font-bold text-red-400">{m.senderName} ({ROLES_CATALOG[m.role]?.name || m.role}): </span>
                            <span className="text-slate-200">{m.message}</span>
                          </div>
                        ))}
                      </div>
                      <form onSubmit={sendMafiaChat} className="flex gap-2">
                        <input type="text" placeholder="Координация ночного выстрела..." value={mafiaInput}
                          onChange={e => setMafiaInput(e.target.value)}
                          className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-red-500" />
                        <button type="submit" className="bg-red-800 hover:bg-red-700 text-white font-bold px-5 py-2 rounded-xl text-sm transition">Шепнуть</button>
                      </form>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
