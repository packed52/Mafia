<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мафия Online</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React и ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel для компиляции JSX прямо в браузере -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Socket.io клиент -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion@11.1.7/dist/framer-motion.js"></script>
  
  <style>
    .perspective-1000 { perspective: 1000px; }
    .preserve-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotateY-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { motion } = FramerMotion;

    // Подключение к сокету (автоматически к текущему серверу Render)
    const socket = io();

    // Web Audio API Звуки
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playCardFlipSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch (e) {}
    }

    function playPhaseChangeSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.01, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      } catch (e) {}
    }

    function App() {
      const [screen, setScreen] = useState('JOIN');
      const [playerName, setPlayerName] = useState('');
      const [roomIdInput, setRoomIdInput] = useState('');
      const [roomData, setRoomData] = useState(null);
      const [myRole, setMyRole] = useState(null);
      const [isCardFlipped, setIsCardFlipped] = useState(false);
      
      const [mafiaMessages, setMafiaMessages] = useState([]);
      const [chatInput, setChatInput] = useState('');
      const [selectedTarget, setSelectedTarget] = useState(null);
      const [phaseInfo, setPhaseInfo] = useState({ status: 'LOBBY', message: '' });
      const [nightResult, setNightResult] = useState(null);

      useEffect(() => {
        socket.on('room:update', (room) => setRoomData(room));
        
        socket.on('game:started', (room) => {
          setRoomData(room);
          const me = room.players.find(p => p.id === socket.id);
          setMyRole(me.role);
          setScreen('REVEAL');
        });

        socket.on('game:phase_change', ({ status, message }) => {
          playPhaseChangeSound();
          setPhaseInfo({ status, message });
          if (status === 'NIGHT') setSelectedTarget(null);
        });

        socket.on('chat:mafia:message', (msg) => {
          setMafiaMessages(prev => [...prev, msg]);
        });

        socket.on('night:results', (res) => {
          setNightResult(res.message);
        });

        socket.on('commissar:result', (res) => {
          alert(`Результат проверки Комиссара: ${res.targetName} — ${res.isMafia ? 'МАФИЯ 🦹‍♂️' : 'МИРНЫЙ 😇'}`);
        });

        socket.on('hobo:result', (res) => {
          alert(`Бомж увидел гостей у цели: ${res.visitors.join(', ') || 'никто не приходил'}`);
        });

        return () => {
          socket.off('room:update');
          socket.off('game:started');
          socket.off('game:phase_change');
          socket.off('chat:mafia:message');
          socket.off('night:results');
          socket.off('commissar:result');
          socket.off('hobo:result');
        };
      }, []);

      const createRoom = () => {
        if (!playerName) return alert('Введите ник!');
        socket.emit('room:create', { playerName }, (res) => {
          if (res.success) {
            setRoomIdInput(res.roomId);
            socket.emit('room:join', { roomId: res.roomId, playerName }, (joinRes) => {
              if (joinRes.success) {
                setRoomData(joinRes.room);
                setScreen('LOBBY');
              }
            });
          }
        });
      };

      const joinRoom = () => {
        if (!playerName || !roomIdInput) return alert('Заполните все поля!');
        socket.emit('room:join', { roomId: roomIdInput, playerName }, (res) => {
          if (res.success) {
            setRoomData(res.room);
            setScreen('LOBBY');
          } else {
            alert(res.message);
          }
        });
      };

      const revealCard = () => {
        if (!isCardFlipped) {
          playCardFlipSound();
          setIsCardFlipped(true);
          socket.emit('player:reveal_card', { roomId: roomData.roomId });
          setTimeout(() => setScreen('GAME'), 3500);
        }
      };

      const sendNightAction = () => {
        if (!selectedTarget) return alert('Выберите цель!');
        let roleActionType = myRole;
        if (myRole === 'don') roleActionType = 'mafia';
        socket.emit('night:action', { roomId: roomData.roomId, role: roleActionType, targetId: selectedTarget });
        alert('Действие успешно отправлено!');
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-4">
          {screen === 'JOIN' && (
            <div className="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl space-y-6">
              <div className="text-center">
                <h1 className="text-3xl font-bold tracking-wider text-amber-500">МАФИЯ ONLINE</h1>
                <p className="text-sm text-slate-400 mt-1">Оригинальные карточные правила</p>
              </div>
              <div className="space-y-4">
                <input 
                  type="text" placeholder="Ваш никнейм" value={playerName} onChange={e => setPlayerName(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 focus:outline-none focus:border-amber-500"
                />
                <input 
                  type="text" placeholder="ID комнаты" value={roomIdInput} onChange={e => setRoomIdInput(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 focus:outline-none focus:border-amber-500"
                />
                <button onClick={joinRoom} className="w-full bg-slate-800 hover:bg-slate-700 font-semibold py-3 rounded-xl transition">
                  Войти в комнату
                </button>
                <button onClick={createRoom} className="w-full bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold py-3 rounded-xl transition">
                  Создать комнату
                </button>
              </div>
            </div>
          )}

          {screen === 'LOBBY' && roomData && (
            <div className="max-w-xl w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl space-y-6">
              <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                <div>
                  <span className="text-xs text-amber-500 font-bold uppercase">Комната</span>
                  <h2 className="text-2xl font-mono">{roomData.roomId}</h2>
                </div>
                <div className="text-right">
                  <span className="text-xs text-slate-400">Игроков</span>
                  <p className="text-xl font-bold">{roomData.players.length}</p>
                </div>
              </div>
              <div className="space-y-2">
                <h3 className="text-sm font-semibold text-slate-400">Участники:</h3>
                <div className="grid grid-cols-2 gap-2">
                  {roomData.players.map(p => (
                    <div key={p.id} className="bg-slate-950 px-4 py-2 rounded-lg border border-slate-800 flex justify-between items-center">
                      <span>{p.name}</span>
                      {p.isHost && <span className="text-xs bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded">Хост</span>}
                    </div>
                  ))}
                </div>
              </div>
              {roomData.hostId === socket.id ? (
                <button onClick={() => socket.emit('game:start', { roomId: roomData.roomId })} className="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl transition">
                  Начать игру
                </button>
              ) : (
                <p className="text-center text-slate-500 text-sm">Ожидание старта от хоста...</p>
              )}
            </div>
          )}

          {screen === 'REVEAL' && (
            <div className="flex flex-col items-center justify-center space-y-6">
              <h2 className="text-2xl font-bold tracking-wide">Ваша секретная роль</h2>
              <div className="perspective-1000 w-72 h-96 cursor-pointer" onClick={revealCard}>
                <motion.div 
                  className="w-full h-full relative preserve-3d rounded-2xl shadow-2xl border border-amber-500/40"
                  animate={{ rotateY: isCardFlipped ? 180 : 0 }}
                  transition={{ duration: 0.8, type: "spring", stiffness: 150 }}
                >
                  <div className="absolute inset-0 w-full h-full backface-hidden bg-slate-900 rounded-2xl flex flex-col items-center justify-center border-4 border-amber-600/30">
                    <span className="text-5xl mb-4 text-amber-500">♠</span>
                    <p className="text-amber-200/70 font-medium tracking-widest text-sm">ТКНИТЕ, ЧТОБЫ ВСКРЫТЬ</p>
                  </div>
                  <div className="absolute inset-0 w-full h-full backface-hidden rotateY-180 bg-gradient-to-b from-slate-900 to-zinc-900 rounded-2xl p-6 flex flex-col items-center justify-between border-4 border-amber-500">
                    <span className="text-xs uppercase tracking-widest text-amber-400 font-bold">Роль</span>
                    <h3 className="text-3xl font-extrabold uppercase text-white">{myRole}</h3>
                    <p className="text-xs text-slate-400 text-center">Карта убрана в карман</p>
                  </div>
                </motion.div>
              </div>
            </div>
          )}

          {screen === 'GAME' && roomData && (
            <div className="max-w-4xl w-full grid grid-cols-1 md:grid-cols-3 gap-6">
              <div className="md:col-span-1 bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-slate-300">Игроки</h3>
                  <span className="text-xs bg-slate-800 px-2 py-1 rounded text-amber-400 uppercase">{phaseInfo.status}</span>
                </div>
                {nightResult && <div className="bg-amber-500/10 border border-amber-500/30 p-3 rounded-lg text-xs text-amber-300">{nightResult}</div>}
                <div className="space-y-2">
                  {roomData.players.map(p => (
                    <div key={p.id} className={`p-3 rounded-xl border flex justify-between items-center ${p.isAlive ? 'bg-slate-950 border-slate-800' : 'bg-red-950/20 border-red-900/40 opacity-60'}`}>
                      <span>{p.name} {p.id === socket.id && '(Вы)'}</span>
                      {p.isAlive ? <span className="text-xs text-emerald-400">Жив</span> : <span className="text-xs text-red-500">Мертв</span>}
                    </div>
                  ))}
                </div>
              </div>

              <div className="md:col-span-2 space-y-6">
                {phaseInfo.status === 'NIGHT' && ['mafia', 'don', 'doctor', 'commissar', 'hooker', 'hobo'].includes(myRole) && (
                  <div className="bg-slate-900 border border-amber-500/30 p-6 rounded-2xl space-y-4">
                    <h3 className="font-bold text-amber-400">Ночное действие ({myRole})</h3>
                    <div className="grid grid-cols-2 gap-2">
                      {roomData.players.filter(p => p.isAlive).map(p => (
                        <button 
                          key={p.id} onClick={() => setSelectedTarget(p.id)}
                          className={`p-3 rounded-xl border text-left transition ${selectedTarget === p.id ? 'bg-amber-500/20 border-amber-500 text-amber-300' : 'bg-slate-950 border-slate-800'}`}
                        >
                          {p.name}
                        </button>
                      ))}
                    </div>
                    <button onClick={sendNightAction} className="w-full bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold py-3 rounded-xl transition">
                      Подтвердить цель
                    </button>
                  </div>
                )}

                {(myRole === 'mafia' || myRole === 'don') && phaseInfo.status === 'NIGHT' && (
                  <div className="bg-slate-900 border border-red-900/40 p-6 rounded-2xl space-y-4">
                    <h3 className="font-bold text-red-400">Ночной чат мафии</h3>
                    <div className="h-40 bg-slate-950 p-4 rounded-xl overflow-y-auto space-y-2 border border-slate-800">
                      {mafiaMessages.map((m, idx) => (
                        <div key={idx} className="text-sm"><span className="font-bold text-red-400">{m.senderName}:</span> {m.message}</div>
                      ))}
                    </div>
                    <div className="flex gap-2">
                      <input 
                        type="text" placeholder="Сообщение..." value={chatInput} onChange={e => setChatInput(e.target.value)}
                        className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 focus:outline-none focus:border-red-500"
                      />
                      <button onClick={() => { socket.emit('chat:mafia', { roomId: roomData.roomId, message: chatInput }); setChatInput(''); }} className="bg-red-900 hover:bg-red-800 px-6 py-2 rounded-xl font-bold transition">
                        Отправить
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );

      ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
